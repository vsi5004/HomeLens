[package]
name = "homelens-server"
version = "0.1.0"
description = "HomeLens LAN web server: exposes homelens-core over HTTP and serves the SPA"
edition = "2021"

[[bin]]
name = "homelens-server"
path = "src/main.rs"

[dependencies]
homelens-core = { path = "../core" }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
